name: tests

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest]
                # Dev dependencies (Testbench 10 / Laravel 12) need PHP 8.2+.
                # Production consumers run 8.4, so it must be in the matrix.
                php: [8.2, 8.3, 8.4]

        name: PHP ${{ matrix.php }} - ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: ${{ matrix.php }}
                extensions: dom, curl, libxml, mbstring, zip, fileinfo
                ini-values: error_reporting=E_ALL
                tools: composer:v2
                coverage: none

            - name: Install dependencies
              run: |
                composer install

            - name: Execute tests
              run: vendor/bin/pest
